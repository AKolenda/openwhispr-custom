name: Build custom Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Verify custom changes
        run: |
          node --import tsx --test test/services/openRouterRouting.test.js test/helpers/escapeCancellation.test.js test/services/escapeCancellationPreference.test.js test/helpers/agentNameDictionaryDefault.test.js
          npm run typecheck

      - name: Install Windows build binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: custom-windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c', 'resources/windows-mic-listener.c') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download windows-key-listener.exe
        run: node scripts/download-windows-key-listener.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compile windows-mic-listener.exe
        shell: cmd
        run: |
          if not exist resources\bin mkdir resources\bin
          cl /O2 /nologo resources\windows-mic-listener.c /Fe:resources\bin\windows-mic-listener.exe ole32.lib oleaut32.lib

      - name: Create runtime env
        shell: bash
        run: |
          echo "OPENWHISPR_CHANNEL=production" > .env
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Build renderer from this checkout
        shell: pwsh
        env:
          VITE_OPENWHISPR_API_URL: https://api.openwhispr.com
          VITE_AUTH_URL: https://auth.openwhispr.com
        run: |
          if (Test-Path -LiteralPath "src/dist") {
            Remove-Item -LiteralPath "src/dist" -Recurse -Force
          }
          npm run build:renderer

      - name: Build unsigned installer
        run: npx electron-builder --win nsis --x64 --publish never --config electron-builder.routing-win.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify rendered packaged Settings UI
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-packaged-settings-ui.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item "dist/OpenWhispr-1.10.2-upstream-escape-v5-x64-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$($installer.FullName).sha256" "$hash  $($installer.Name)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWhispr-1.10.2-custom-Windows-x64
          path: |
            dist/OpenWhispr-1.10.2-upstream-escape-v5-x64-Setup.exe
            dist/OpenWhispr-1.10.2-upstream-escape-v5-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "custom-v1.10.2-r5"
          $files = @(
            "dist/OpenWhispr-1.10.2-upstream-escape-v5-x64-Setup.exe",
            "dist/OpenWhispr-1.10.2-upstream-escape-v5-x64-Setup.exe.sha256"
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "OpenWhispr 1.10.2 custom Windows build r5" --notes-file CUSTOM-BUILD.md
          }
